aid: ambient-clinical-analytics
name: Ambient Clinical Analytics
description: 'Ambient Clinical Analytics is a Rochester, Minnesota clinical decision
  support company spun out of Mayo Clinic in 2013 and operating from the Mayo Clinic
  Business Accelerator. Its AWARE Patient Surveillance and AWARE Sepsis DART products
  are FDA Class II cleared, EMR-agnostic "bolt-on" dashboards that apply more than
  1,200 licensed Mayo Clinic rules and algorithms to live patient data, delivering
  point-of-care data visualization, situational awareness of a patient''s total condition,
  and smart notifications for conditions such as sepsis across ICU, tele-ICU and remote
  patient monitoring settings. Deployment is carried out by third-party EMR data-integration
  partners rather than by hospital IT; the company publishes no public developer program,
  API documentation, or machine-readable API contract.'
